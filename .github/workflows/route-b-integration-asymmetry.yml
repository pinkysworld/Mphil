name: Route B integration asymmetry

on:
  push:
    branches:
      - supervisor-revision-2026-08-29
    paths:
      - 'scripts/25_integration_asymmetry_walkforward.py'
      - '.github/workflows/route-b-integration-asymmetry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-b:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: supervisor-revision-2026-08-29

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install defended environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install 'gdown==5.2.0'

      - name: Syntax check Route B analysis
        run: python -m py_compile scripts/25_integration_asymmetry_walkforward.py

      - name: Download official reduced Avast-CTU CAPEv2 dataset
        run: |
          mkdir -p data/raw
          python -m gdown 1xujiSqV0sUv4GinS2xq8XFRpZLvvs1um \
            -O data/raw/avast_ctu_reduced.zip
          sha256sum data/raw/avast_ctu_reduced.zip

      - name: Rebuild leakage-controlled raw features
        run: |
          python scripts/01_ingest.py
          python scripts/02_leakage_audit.py
          python scripts/04_extract_features.py --extract-only

      - name: Run lagged Route B H5 analysis
        run: |
          python scripts/25_integration_asymmetry_walkforward.py \
            --seed 42 \
            --start-date 2018-06-01 \
            --delta-days 30 \
            --hash-dim 32768 \
            --bootstrap 2000 \
            --permutations 2000

      - name: Archive Route B outputs in repository
        run: |
          target='results/2026-08-30-route-b-integration-asymmetry'
          mkdir -p "$target"
          cp -a artifacts/route_b_integration_asymmetry/. "$target/"
          sha256sum "$target"/* | sort > "$target/SHA256SUMS"
          cat > "$target/README.md" <<'EOF'
          # Route B integration-asymmetry analysis

          This directory archives the exploratory H5 analysis requested by the
          supervisor-revision plan. It tests whether concentration of positive
          leave-one-view-out marginal contributions in one rolling-origin window is
          associated with greater fused-model Macro-F1 decay in the next eligible
          window.

          The test is deliberately lagged and reports a moving-block bootstrap
          interval plus a circular-shift permutation p-value because adjacent
          expanding-window observations are temporally dependent. It is an
          exploratory MPhil theory test and not causal evidence. A null, reversed,
          or unstable result weakens H5 and must be reported as such.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Archive Route B integration asymmetry results'
          git push origin HEAD:supervisor-revision-2026-08-29
